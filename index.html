<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монополия Онлайн (P2P)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <style>
        :root {
            --bg-dark: #121826; --panel-bg: #1f2937; --panel-border: #374151;
            --board-bg: #f5f2eb; --board-center: #eae5d9; --cell-border: #cfc9bb;
            --text-dark: #1e293b; --accent-gold: #fbbf24; --accent-green: #10b981;
            
            --c-brown: #8b5a2b; --c-lightblue: #0284c7; --c-pink: #db2777; --c-orange: #ea580c;
            --c-red: #dc2626; --c-yellow: #ca8a04; --c-green: #16a34a; --c-darkblue: #2563eb;
            --c-railroad: #475569; --c-utility: #0d9488;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background-color: var(--bg-dark); color: #f3f4f6; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

        /* ЛОББИ */
        #lobby { background: var(--panel-bg); padding: 32px; border-radius: 14px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid var(--panel-border); z-index: 10; }
        #lobby h1 { font-size: 24px; color: var(--accent-gold); margin-bottom: 6px; text-align: center; }
        #lobby p.sub { font-size: 13px; color: #9ca3af; text-align: center; margin-bottom: 22px; }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; color: #9ca3af; }
        .input-group input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--panel-border); background: #111827; color: #fff; font-size: 15px; outline: none; }
        .btn { width: 100%; padding: 10px 14px; background: var(--accent-green); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.15s; }
        .btn:hover:not(:disabled) { filter: brightness(1.1); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-secondary { background: #374151; margin-top: 8px; }

        /* ОСНОВНОЙ ЭКРАН */
        #game-screen { display: none; width: 100vw; height: 100vh; grid-template-columns: 260px 1fr 290px; grid-template-rows: 52px 1fr; padding: 12px; gap: 12px; }
        header { grid-column: 1 / -1; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; }
        .header-title { font-weight: 800; font-size: 16px; color: var(--accent-gold); display: flex; align-items: center; gap: 8px; }
        .badge-btn { background: #111827; color: #e5e7eb; border: 1px solid var(--panel-border); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; }

        /* ИГРОКИ */
        .sidebar-left, .sidebar-right { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; height: 100%; }
        .player-card { background: var(--panel-bg); border: 2px solid var(--panel-border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; transition: 0.2s; }
        .player-card.active { border-color: var(--accent-gold); box-shadow: 0 0 14px rgba(251, 191, 36, 0.28); }
        .player-identity { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
        .player-token-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; }
        .player-money { font-size: 17px; font-weight: 800; color: #34d399; }
        .prop-pip { width: 12px; height: 8px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.4); display: inline-block; margin-right: 2px;}

        /* ДОСКА */
        .board-wrapper { display: flex; align-items: center; justify-content: center; overflow: hidden; height: 100%; }
        .board { height: min(calc(100vh - 80px), calc(100vw - 590px)); aspect-ratio: 1 / 1; background: var(--board-bg); border: 3px solid #2d3748; border-radius: 8px; display: grid; grid-template-columns: 1.35fr repeat(9, 1fr) 1.35fr; grid-template-rows: 1.35fr repeat(9, 1fr) 1.35fr; box-shadow: 0 15px 35px rgba(0,0,0,0.5); position: relative; }
        .cell { border: 1px solid rgba(0, 0, 0, 0.18); background: var(--board-bg); color: var(--text-dark); position: relative; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 4px 3px; text-align: center; cursor: pointer; transition: filter 0.2s; overflow: hidden; }
        .cell:hover { z-index: 2; transform: scale(1.03); }
        .cell.colored-cell { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.55); }
        .cell.colored-cell .cell-price { color: #fff; background: rgba(0,0,0,0.25); padding: 1px 5px; border-radius: 4px; }
        .cell.owned { filter: brightness(0.6) saturate(0.9); }
        
        .owner-marker { position: absolute; top: 3px; right: 3px; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #fff; z-index: 4; }
        .buildings-layer { position: absolute; top: 2px; left: 2px; right: 14px; display: flex; gap: 2px; z-index: 4; }
        .house { width: 9px; height: 9px; background: #22c55e; border: 1px solid #14532d; border-radius: 2px; }
        .hotel { width: 11px; height: 11px; background: #ef4444; border: 1px solid #7f1d1d; border-radius: 2px; }

        .cell-content { display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 100%; height: 100%; z-index: 2; }
        .cell-name { font-size: clamp(7px, 0.68vw, 10px); font-weight: 700; line-height: 1.1; max-width: 100%; }
        .cell-icon { font-size: clamp(11px, 1.15vw, 17px); margin: auto 0; }
        .cell-price { font-size: clamp(7px, 0.62vw, 9px); font-weight: 700; color: #334155; }
        .cell.corner { background: #e6e0d2; justify-content: center; padding: 6px; }
        
        .tokens-layer { position: absolute; inset: 2px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px; pointer-events: none; z-index: 6; }
        .board-token { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.65); transition: all 0.25s ease; }

        /* ЦЕНТР */
        .board-center { grid-column: 2 / 11; grid-row: 2 / 11; background: var(--board-center); border: 1px solid var(--cell-border); display: grid; grid-template-rows: auto 1fr auto; padding: 16px; position: relative; }
        .center-main { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
        .brand-logo { font-size: clamp(18px, 2vw, 26px); font-weight: 800; letter-spacing: 3px; color: #1e293b; }
        
        /* --- НОВАЯ АНИМАЦИЯ КУБИКОВ --- */
        .dice-area { display: flex; gap: 20px; margin: 15px 0; perspective: 800px; }
        .die-wrapper { position: relative; width: 60px; height: 60px; }
        .die-shadow { position: absolute; bottom: -10px; left: 5%; width: 90%; height: 10px; background: rgba(0, 0, 0, 0.25); border-radius: 50%; filter: blur(4px); transition: all 0.15s ease; z-index: 1; }
        .die { position: relative; width: 100%; height: 100%; background: #ffffff; border-radius: 12px; box-shadow: inset 0 -4px 8px rgba(0,0,0,0.1), inset 0 2px 4px rgba(255,255,255,0.8), 0 4px 10px rgba(0,0,0,0.2); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 10px; z-index: 2; transform-style: preserve-3d; }
        .pip { width: 10px; height: 10px; background: #1e293b; border-radius: 50%; box-shadow: inset 0 2px 3px rgba(0,0,0,0.4), 0 1px 1px rgba(255,255,255,0.5); align-self: center; justify-self: center; }
        
        .face-1 .pip:nth-child(1) { grid-area: 2 / 2; }
        .face-2 .pip:nth-child(1) { grid-area: 1 / 1; }
        .face-2 .pip:nth-child(2) { grid-area: 3 / 3; }
        .face-3 .pip:nth-child(1) { grid-area: 1 / 1; }
        .face-3 .pip:nth-child(2) { grid-area: 2 / 2; }
        .face-3 .pip:nth-child(3) { grid-area: 3 / 3; }
        .face-4 .pip:nth-child(1) { grid-area: 1 / 1; }
        .face-4 .pip:nth-child(2) { grid-area: 1 / 3; }
        .face-4 .pip:nth-child(3) { grid-area: 3 / 1; }
        .face-4 .pip:nth-child(4) { grid-area: 3 / 3; }
        .face-5 .pip:nth-child(1) { grid-area: 1 / 1; }
        .face-5 .pip:nth-child(2) { grid-area: 1 / 3; }
        .face-5 .pip:nth-child(3) { grid-area: 2 / 2; }
        .face-5 .pip:nth-child(4) { grid-area: 3 / 1; }
        .face-5 .pip:nth-child(5) { grid-area: 3 / 3; }
        .face-6 .pip:nth-child(1) { grid-area: 1 / 1; }
        .face-6 .pip:nth-child(2) { grid-area: 1 / 3; }
        .face-6 .pip:nth-child(3) { grid-area: 2 / 1; }
        .face-6 .pip:nth-child(4) { grid-area: 2 / 3; }
        .face-6 .pip:nth-child(5) { grid-area: 3 / 1; }
        .face-6 .pip:nth-child(6) { grid-area: 3 / 3; }

        .die.rolling { animation: tumble 0.8s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
        .die-wrapper.rolling .die-shadow { animation: shadowPulse 0.8s infinite; }
        
        @keyframes tumble {
            0% { transform: translateY(0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1); }
            25% { transform: translateY(-25px) rotateX(180deg) rotateY(90deg) rotateZ(45deg) scale(1.1); }
            50% { transform: translateY(-40px) rotateX(360deg) rotateY(180deg) rotateZ(90deg) scale(1.15); }
            75% { transform: translateY(-15px) rotateX(540deg) rotateY(270deg) rotateZ(135deg) scale(1.05); }
            100% { transform: translateY(0) rotateX(720deg) rotateY(360deg) rotateZ(180deg) scale(1); }
        }
        @keyframes shadowPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(0.6); opacity: 0.1; }
        }

        .action-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .action-buttons .btn { width: auto; padding: 8px 14px; font-size: 13px; }

        .property-preview { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 8px 14px; width: 260px; text-align: center; color: #1e293b;}
        .property-preview-header { height: 8px; border-radius: 4px; margin-bottom: 5px; }
        .property-preview-title { font-weight: 800; font-size: 13px; margin-bottom: 2px; }
        .property-preview-meta { font-size: 11px; color: #475569; }

        /* ЧАТ */
        .chat-panel { flex: 1; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px; display: flex; flex-direction: column; padding: 10px; gap: 8px; min-height: 0; }
        .chat-messages { flex: 1; background: #111827; border-radius: 6px; padding: 8px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 5px; }
        .chat-input-row { display: flex; gap: 6px; }
        .chat-input-row input { flex: 1; background: #111827; border: 1px solid var(--panel-border); color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; outline: none; }
        .chat-input-row button { background: #2563eb; color: #fff; border: none; padding: 0 12px; border-radius: 6px; cursor: pointer; }

        /* МОДАЛЬНЫЕ ОКНА ТОРГОВЛИ */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 20px; width: 90%; max-width: 550px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .modal-title { font-size: 18px; color: #fff; margin-bottom: 15px; text-align: center; }
        .trade-cols { display: flex; gap: 20px; margin-bottom: 20px; }
        .trade-col { flex: 1; background: #111827; border-radius: 8px; padding: 12px; }
        .trade-col h4 { font-size: 14px; color: var(--accent-gold); margin-bottom: 10px; text-align: center; }
        .prop-list { max-height: 150px; overflow-y: auto; margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
        .prop-list label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #e5e7eb; cursor: pointer; background: #1f2937; padding: 6px; border-radius: 4px; }
        .prop-list input { cursor: pointer; }
    </style>
</head>
<body>

    <!-- ЛОББИ -->
    <div id="lobby">
        <h1>МОНОПОЛИЯ</h1>
        <div class="input-group">
            <label>Ваше имя</label>
            <input type="text" id="username" value="Игрок 1" maxlength="16">
        </div>
        <button class="btn" onclick="createRoom()">Создать игру (Хост)</button>
        <div style="margin: 16px 0; text-align: center; color: #6b7280; font-size: 12px;">— ИЛИ —</div>
        <div class="input-group">
            <label>Код комнаты</label>
            <input type="text" id="room-code-input" placeholder="Код приглашения">
        </div>
        <button class="btn btn-secondary" onclick="joinRoom()">Войти в комнату</button>
    </div>

    <!-- ИГРА -->
    <div id="game-screen">
        <header>
            <div class="header-title">🎩 МОНОПОЛИЯ</div>
            <button class="badge-btn" onclick="copyInviteLink()">🔗 Копировать ссылку</button>
        </header>

        <div class="sidebar-left" id="left-players"></div>

        <div class="board-wrapper">
            <div class="board" id="board">
                <div class="board-center">
                    <div class="center-main" style="margin-top: 20px;">
                        <div class="brand-logo">МОНОПОЛИЯ</div>
                        <div style="color:#475569; font-weight:600; font-size:13px;" id="turn-banner">Ожидание...</div>
                        
                        <div class="dice-area">
                            <div class="die-wrapper" id="die-wrap-1">
                                <div class="die-shadow"></div>
                                <div class="die" id="die-1"></div>
                            </div>
                            <div class="die-wrapper" id="die-wrap-2">
                                <div class="die-shadow"></div>
                                <div class="die" id="die-2"></div>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn" id="roll-btn" onclick="rollDice()">Бросить кубики 🎲</button>
                            <button class="btn" id="buy-btn" style="background: #2563eb; display: none;" onclick="buyCurrentCell()">Купить</button>
                            <button class="btn" id="build-btn" style="background: #16a34a; display: none;" onclick="buildHouse()">Построить 🏠</button>
                            <button class="btn" id="trade-btn" style="background: #8b5cf6; display: none;" onclick="openTradeModal()">Обмен 🤝</button>
                            <button class="btn" id="end-turn-btn" style="background: #475569; display: none;" onclick="endTurn()">Завершить ход ⏭️</button>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: center; align-items: flex-end; margin-bottom:10px;">
                        <div class="property-preview" id="cell-inspector">
                            <div class="property-preview-header" id="insp-color" style="background: #cbd5e1;"></div>
                            <div class="property-preview-title" id="insp-title">Добро пожаловать!</div>
                            <div class="property-preview-meta" id="insp-meta">Поля готовы к застройке</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar-right">
            <div id="right-players" style="display: flex; flex-direction: column; gap: 10px;"></div>
            <div class="chat-panel">
                <div style="font-size: 12px; font-weight: 700; color: #9ca3af;">ХРОНИКА</div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: СОЗДАНИЕ ОБМЕНА -->
    <div class="modal-overlay" id="modal-trade-offer">
        <div class="modal-content">
            <div class="modal-title">Предложить сделку</div>
            <div class="input-group">
                <label>Выберите игрока:</label>
                <select id="trade-target-select" style="width:100%; padding:10px; border-radius:6px; background:#111827; color:#fff; border:1px solid #374151;" onchange="updateTradeModalProps()"></select>
            </div>
            
            <div class="trade-cols">
                <!-- Ваша сторона -->
                <div class="trade-col">
                    <h4>Вы отдаете:</h4>
                    <div class="input-group">
                        <label>Доплата ($):</label>
                        <input type="number" id="trade-offer-money" value="0" min="0">
                    </div>
                    <label style="font-size:12px; color:#9ca3af;">Ваши улицы (без домов):</label>
                    <div class="prop-list" id="trade-offer-props"></div>
                </div>
                <!-- Их сторона -->
                <div class="trade-col">
                    <h4>Вы хотите:</h4>
                    <div class="input-group">
                        <label>Доплата ($):</label>
                        <input type="number" id="trade-request-money" value="0" min="0">
                    </div>
                    <label style="font-size:12px; color:#9ca3af;">Их улицы (без домов):</label>
                    <div class="prop-list" id="trade-request-props"></div>
                </div>
            </div>

            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#8b5cf6;" onclick="sendTradeOffer()">Предложить сделку</button>
                <button class="btn btn-secondary" onclick="closeModal('modal-trade-offer')">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: ВХОДЯЩИЙ ЗАПРОС -->
    <div class="modal-overlay" id="modal-trade-request">
        <div class="modal-content">
            <div class="modal-title" style="color:#fbbf24;">Входящее предложение!</div>
            <div id="trade-request-details" style="font-size:14px; line-height:1.5; text-align:center; margin-bottom:20px; color:#e5e7eb;"></div>
            
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#10b981;" onclick="acceptTrade()">Принять сделку</button>
                <button class="btn btn-secondary" onclick="rejectTrade()" style="background:#ef4444;">Отклонить</button>
            </div>
        </div>
    </div>

    <script>
        const PLAYER_COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#a855f7', '#ec4899'];

        const BOARD_CELLS = [
            { id: 0, name: "ВПЕРЕД", type: "corner", icon: "➡️", sub: "+$200" },
            { id: 1, name: "Житная ул.", type: "street", color: "var(--c-brown)", price: 60, rent: 2, housePrice: 50 },
            { id: 2, name: "Казна", type: "chest", icon: "📦" },
            { id: 3, name: "Нагатинская", type: "street", color: "var(--c-brown)", price: 60, rent: 4, housePrice: 50 },
            { id: 4, name: "Налог", type: "tax", icon: "💎", price: 200 },

            { id: 6, name: "Варшавское ш.", type: "street", color: "var(--c-lightblue)", price: 100, rent: 6, housePrice: 50 },

            { id: 10, name: "ТЮРЬМА", type: "corner", icon: "⛓️", sub: "Отдых" },
            { id: 11, name: "Полянка ул.", type: "street", color: "var(--c-pink)", price: 140, rent: 10, housePrice: 100 },
            { id: 12, name: "Электросеть", type: "utility", color: "var(--c-utility)", icon: "💡", price: 150, rent: 15 },
            { id: 13, name: "Сретенка ул.", type: "street", color: "var(--c-pink)", price: 140, rent: 10, housePrice: 100 },
            { id: 14, name: "Ростовская наб.", type: "street", color: "var(--c-pink)", price: 160, rent: 12, housePrice: 100 },
            { id: 15, name: "Курская ж/д", type: "railroad", color: "var(--c-railroad)", icon: "🚂", price: 200, rent: 25 },
            { id: 16, name: "Рязанский пр.", type: "street", color: "var(--c-orange)", price: 180, rent: 14, housePrice: 100 },
            { id: 17, name: "Казна", type: "chest", icon: "📦" },
            { id: 18, name: "Вавилова ул.", type: "street", color: "var(--c-orange)", price: 180, rent: 14, housePrice: 100 },
            { id: 19, name: "Рублевское ш.", type: "street", color: "var(--c-orange)", price: 200, rent: 16, housePrice: 100 },
            { id: 20, name: "ПАРКОВКА", type: "corner", icon: "🅿️", sub: "Бесплатно" },
            { id: 21, name: "Тверская ул.", type: "street", color: "var(--c-red)", price: 220, rent: 18, housePrice: 150 },
            { id: 22, name: "Шанс", type: "chance", icon: "❓" },
            { id: 23, name: "Пушкинская ул.", type: "street", color: "var(--c-red)", price: 220, rent: 18, housePrice: 150 },
            { id: 24, name: "Пл. Маяковского", type: "street", color: "var(--c-red)", price: 240, rent: 20, housePrice: 150 },
            { id: 25, name: "Казанская ж/д", type: "railroad", color: "var(--c-railroad)", icon: "🚂", price: 200, rent: 25 },
            { id: 26, name: "Грузинский вал", type: "street", color: "var(--c-yellow)", price: 260, rent: 22, housePrice: 150 },
            { id: 27, name: "Чайковского ул.", type: "street", color: "var(--c-yellow)", price: 260, rent: 22, housePrice: 150 },
            { id: 28, name: "Водопровод", type: "utility", color: "var(--c-utility)", icon: "🚰", price: 150, rent: 15 },
            { id: 29, name: "Смоленская пл.", type: "street", color: "var(--c-yellow)", price: 280, rent: 24, housePrice: 150 },
            { id: 30, name: "В ТЮРЬМУ", type: "corner", icon: "🚓" },
            { id: 31, name: "Щусева ул.", type: "street", color: "var(--c-green)", price: 300, rent: 26, housePrice: 200 },
            { id: 32, name: "Гоголевский б-р", type: "street", color: "var(--c-green)", price: 300, rent: 26, housePrice: 200 },
            { id: 33, name: "Казна", type: "chest", icon: "📦" },
            { id: 34, name: "Кутузовский пр.", type: "street", color: "var(--c-green)", price: 320, rent: 28, housePrice: 200 },
            { id: 35, name: "Ленинградская ж/д", type: "railroad", color: "var(--c-railroad)", icon: "🚂", price: 200, rent: 25 },
            { id: 36, name: "Шанс", type: "chance", icon: "❓" },
            { id: 37, name: "Малая Бронная", type: "street", color: "var(--c-darkblue)", price: 350, rent: 35, housePrice: 200 },
            { id: 38, name: "Налог", type: "tax", icon: "💍", price: 100 },
            { id: 39, name: "Арбат", type: "street", color: "var(--c-darkblue)", price: 400, rent: 50, housePrice: 200 }
        ];

        function getGridCoords(index) {
            if (index <= 10) return { row: 1, col: 1 + index };
            if (index <= 20) return { row: 1 + (index - 10), col: 11 };
            if (index <= 30) return { row: 11, col: 11 - (index - 20) };
            return { row: 11 - (index - 30), col: 1 };
        }

        let peer = null, hostConn = null, clientConns = [];
        let isHost = false, myId = '', activeRoomId = '';
        let players = [], ownedCells = {}, currentTurnIndex = 0, turnPhase = 'ROLL', selectedCellId = null;
        let pendingTrade = null;

        window.addEventListener('DOMContentLoaded', () => {
            renderBoard();
            
            // Инициализация кубиков при старте
            renderDieFace(document.getElementById('die-1'), 1);
            renderDieFace(document.getElementById('die-2'), 1);

            const params = new URLSearchParams(window.location.search);
            if (params.get('room')) document.getElementById('room-code-input').value = params.get('room');
        });

        function calculateRent(cellId) {
            const cell = BOARD_CELLS[cellId];
            if (cell.type !== 'street' || !ownedCells[cellId]) return cell.rent || 20;
            const ownerId = ownedCells[cellId].ownerId;
            const houses = ownedCells[cellId].houses || 0;
            const sameColorCells = BOARD_CELLS.filter(c => c.color === cell.color);
            const hasMonopoly = sameColorCells.every(c => ownedCells[c.id] && ownedCells[c.id].ownerId === ownerId);

            if (houses === 0) return hasMonopoly ? cell.rent * 2 : cell.rent;
            const multipliers = [1, 5, 15, 40, 50, 60]; 
            return cell.rent * multipliers[houses];
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.querySelectorAll('.cell').forEach(el => el.remove());

            BOARD_CELLS.forEach(cell => {
                const pos = getGridCoords(cell.id);
                const owner = ownedCells[cell.id];
                
                const div = document.createElement('div');
                div.className = `cell ${cell.type === 'corner' ? 'corner' : ''} ${cell.color ? 'colored-cell' : ''} ${owner ? 'owned' : ''}`;
                div.style.gridRow = pos.row;
                div.style.gridColumn = pos.col;
                if (cell.color) div.style.background = cell.color;
                
                div.onclick = () => { selectedCellId = cell.id; syncUI(); };

                let buildingsHTML = '';
                if (owner && owner.houses > 0) {
                    if (owner.houses === 5) {
                        buildingsHTML = `<div class="hotel"></div>`;
                    } else {
                        for(let i = 0; i < owner.houses; i++) buildingsHTML += `<div class="house"></div>`;
                    }
                }

                div.innerHTML = `
                    ${owner ? `<div class="owner-marker" style="background: ${owner.color}"></div>` : ''}
                    <div class="buildings-layer">${buildingsHTML}</div>
                    <div class="cell-content">
                        <div class="cell-name">${cell.name}</div>
                        ${cell.icon ? `<div class="cell-icon">${cell.icon}</div>` : ''}
                        ${cell.price ? `<div class="cell-price">$${cell.price}</div>` : (cell.sub ? `<div class="cell-price">${cell.sub}</div>` : '')}
                    </div>
                    <div class="tokens-layer" id="tokens-cell-${cell.id}"></div>
                `;
                boardEl.appendChild(div);
            });
        }

        // --- СЕТЬ ---
        function createRoom() {
            isHost = true; 
            peer = new Peer({
                host: 'xfenix.ru',
                port: 443,
                secure: true,
                path: '/'
            });

            peer.on('open', (id) => {
                myId = id; activeRoomId = id;
                players = [{ id: myId, name: document.getElementById('username').value || 'Хост', money: 1500, pos: 0, color: PLAYER_COLORS[0] }];
                document.getElementById('lobby').style.display = 'none';
                document.getElementById('game-screen').style.display = 'grid';
                syncUI();
            });
            peer.on('connection', (conn) => {
                clientConns.push(conn);
                conn.on('data', (data) => handleHostData(data, conn));
            });
        }

        function joinRoom() {
            const code = document.getElementById('room-code-input').value.trim();
            if (!code) return;
            isHost = false; activeRoomId = code; 
            peer = new Peer({
                host: 'xfenix.ru',
                port: 443,
                secure: true,
                path: '/'
            });

            peer.on('open', (id) => {
                myId = id; hostConn = peer.connect(code);
                hostConn.on('open', () => {
                    document.getElementById('lobby').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'grid';
                    hostConn.send({ type: 'JOIN', name: document.getElementById('username').value || 'Игрок' });
                });
                hostConn.on('data', (data) => handleClientData(data));
            });
        }

        function handleHostData(data, conn) {
            if (data.type === 'JOIN' && players.length < 6) {
                players.push({ id: conn.peer, name: data.name, money: 1500, pos: 0, color: PLAYER_COLORS[players.length % 6] });
                broadcastState();
                broadcastLog('Система', `${data.name} в игре.`);
            } else if (data.type === 'ROLL') { processRoll(conn.peer); }
            else if (data.type === 'BUY') { processBuy(conn.peer); }
            else if (data.type === 'BUILD') { processBuild(conn.peer, data.cellId); }
            else if (data.type === 'END_TURN') { processEndTurn(conn.peer); }
            else if (data.type === 'CHAT') { broadcastLog(data.name, data.text); }
            else if (data.type === 'TRADE_OFFER') {
                if (data.toId === myId) handleTradeRequest(data);
                else { const targetConn = clientConns.find(c => c.peer === data.toId); if (targetConn) targetConn.send(data); }
            }
            else if (data.type === 'TRADE_ACCEPT') { processTradeAccept(data.offer); }
            else if (data.type === 'TRADE_REJECT') { broadcastLog('Отказ', `${players.find(p=>p.id===data.fromId)?.name} отклонил сделку.`); }
        }

        function handleClientData(data) {
            if (data.type === 'STATE') {
                players = data.players; ownedCells = data.ownedCells;
                currentTurnIndex = data.currentTurnIndex; turnPhase = data.turnPhase;
                if (data.dice) playDiceAnim(data.dice[0], data.dice[1], syncUI); else syncUI();
            } else if (data.type === 'LOG') { appendLog(data.name, data.text); }
            else if (data.type === 'TRADE_OFFER') { handleTradeRequest(data); }
        }

        // --- ЛОГИКА ИГРЫ ---
        function processRoll(peerId) {
            const p = players[currentTurnIndex];
            if (!p || p.id !== peerId || turnPhase !== 'ROLL') return;

            const d1 = Math.floor(Math.random() * 6) + 1, d2 = Math.floor(Math.random() * 6) + 1;
            p.pos = (p.pos + d1 + d2) % 40;
            
            const cell = BOARD_CELLS[p.pos];
            if (ownedCells[cell.id] && ownedCells[cell.id].ownerId !== p.id) {
                const rent = calculateRent(cell.id);
                p.money -= rent;
                players.find(pl => pl.id === ownedCells[cell.id].ownerId).money += rent;
                broadcastLog('💸 Рента', `${p.name} заплатил $${rent} за «${cell.name}».`);
            }

            turnPhase = 'ACTION';
            selectedCellId = p.pos;
            clientConns.forEach(c => c.send({ type: 'STATE', players, ownedCells, currentTurnIndex, turnPhase, dice: [d1, d2] }));
            playDiceAnim(d1, d2, () => { syncUI(); broadcastLog('🎲 Ход', `${p.name} пошел на «${cell.name}».`); });
        }

        function processBuy(peerId) {
            const p = players[currentTurnIndex];
            const cell = BOARD_CELLS[p.pos];
            if (p.id === peerId && cell.price && !ownedCells[cell.id] && p.money >= cell.price) {
                p.money -= cell.price;
                ownedCells[cell.id] = { ownerId: p.id, color: p.color, houses: 0 };
                broadcastState(); broadcastLog('🔑 Покупка', `${p.name} купил «${cell.name}».`);
            }
        }

        function processBuild(peerId, cellId) {
            const p = players[currentTurnIndex];
            const cell = BOARD_CELLS[cellId];
            if (p.id !== peerId || !ownedCells[cellId] || ownedCells[cellId].ownerId !== p.id) return;
            
            if (p.money >= cell.housePrice && ownedCells[cellId].houses < 5) {
                p.money -= cell.housePrice;
                ownedCells[cellId].houses++;
                broadcastState();
                broadcastLog('🏗️ Стройка', `${p.name} построил здание на «${cell.name}».`);
            }
        }

        function processEndTurn(peerId) {
            if (players[currentTurnIndex].id === peerId && turnPhase === 'ACTION') {
                currentTurnIndex = (currentTurnIndex + 1) % players.length;
                turnPhase = 'ROLL';
                broadcastState();
            }
        }

        // --- ЛОГИКА ТОРГОВЛИ ---
        function openTradeModal() {
            const select = document.getElementById('trade-target-select');
            select.innerHTML = '';
            players.forEach(p => { if (p.id !== myId) select.innerHTML += `<option value="${p.id}">${p.name}</option>`; });
            if (players.length < 2) return alert("Недостаточно игроков для обмена.");
            
            document.getElementById('modal-trade-offer').style.display = 'flex';
            updateTradeModalProps();
        }

        function updateTradeModalProps() {
            const targetId = document.getElementById('trade-target-select').value;
            const myPropsDiv = document.getElementById('trade-offer-props');
            const targetPropsDiv = document.getElementById('trade-request-props');
            
            myPropsDiv.innerHTML = ''; targetPropsDiv.innerHTML = '';

            Object.keys(ownedCells).forEach(cellId => {
                const info = ownedCells[cellId];
                if (info.houses > 0) return;

                const cell = BOARD_CELLS[cellId];
                const html = `<label><input type="checkbox" value="${cellId}"> <span style="display:inline-block; width:8px; height:8px; background:${cell.color || '#fff'};"></span> ${cell.name}</label>`;
                
                if (info.ownerId === myId) myPropsDiv.innerHTML += html;
                else if (info.ownerId === targetId) targetPropsDiv.innerHTML += html;
            });
            if(myPropsDiv.innerHTML==='') myPropsDiv.innerHTML = '<i>Нет доступных участков</i>';
            if(targetPropsDiv.innerHTML==='') targetPropsDiv.innerHTML = '<i>Нет доступных участков</i>';
        }

        function sendTradeOffer() {
            const targetId = document.getElementById('trade-target-select').value;
            const offerMoney = parseInt(document.getElementById('trade-offer-money').value) || 0;
            const requestMoney = parseInt(document.getElementById('trade-request-money').value) || 0;
            
            const offerProps = Array.from(document.querySelectorAll('#trade-offer-props input:checked')).map(cb => parseInt(cb.value));
            const requestProps = Array.from(document.querySelectorAll('#trade-request-props input:checked')).map(cb => parseInt(cb.value));

            const me = players.find(p => p.id === myId);
            if (offerMoney > me.money) return alert("У вас недостаточно денег для этой сделки!");

            const offerData = { type: 'TRADE_OFFER', fromId: myId, toId: targetId, fromName: me.name, offerMoney, requestMoney, offerProps, requestProps };
            
            if (isHost) {
                if (targetId === myId) return;
                const targetConn = clientConns.find(c => c.peer === targetId);
                if(targetConn) targetConn.send(offerData);
            } else {
                hostConn.send(offerData);
            }
            closeModal('modal-trade-offer');
            appendLog('Система', `Вы отправили предложение игроку.`);
        }

        function handleTradeRequest(data) {
            pendingTrade = data;
            const detailsDiv = document.getElementById('trade-request-details');
            
            let giveText = data.requestMoney > 0 ? `$${data.requestMoney}<br>` : '';
            data.requestProps.forEach(id => giveText += `• ${BOARD_CELLS[id].name}<br>`);
            if(!giveText) giveText = "Ничего<br>";

            let getText = data.offerMoney > 0 ? `$${data.offerMoney}<br>` : '';
            data.offerProps.forEach(id => getText += `• ${BOARD_CELLS[id].name}<br>`);
            if(!getText) getText = "Ничего<br>";

            detailsDiv.innerHTML = `
                <b>Игрок ${data.fromName} предлагает сделку!</b><br><br>
                <div style="background:#1f2937; padding:10px; border-radius:8px;">
                    <span style="color:#ef4444;">Вы отдаете:</span><br>${giveText}<br>
                    <span style="color:#10b981;">Вы получаете:</span><br>${getText}
                </div>
            `;
            document.getElementById('modal-trade-request').style.display = 'flex';
        }

        function acceptTrade() {
            if(!pendingTrade) return;
            const me = players.find(p => p.id === myId);
            if (pendingTrade.requestMoney > me.money) {
                alert("У вас недостаточно денег!"); return;
            }
            if (isHost) processTradeAccept(pendingTrade);
            else hostConn.send({ type: 'TRADE_ACCEPT', offer: pendingTrade });
            closeModal('modal-trade-request');
        }

        function rejectTrade() {
            if (isHost) broadcastLog('Отказ', `Игрок отклонил сделку.`);
            else hostConn.send({ type: 'TRADE_REJECT', fromId: myId });
            closeModal('modal-trade-request');
        }

        function processTradeAccept(offer) {
            const p1 = players.find(p => p.id === offer.fromId);
            const p2 = players.find(p => p.id === offer.toId);
            if (!p1 || !p2) return;

            p1.money = p1.money - offer.offerMoney + offer.requestMoney;
            p2.money = p2.money - offer.requestMoney + offer.offerMoney;

            offer.offerProps.forEach(id => {
                if(ownedCells[id]) { ownedCells[id].ownerId = p2.id; ownedCells[id].color = p2.color; }
            });
            offer.requestProps.forEach(id => {
                if(ownedCells[id]) { ownedCells[id].ownerId = p1.id; ownedCells[id].color = p1.color; }
            });

            broadcastState();
            broadcastLog('🤝 Сделка', `${p1.name} и ${p2.name} успешно совершили обмен!`);
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // --- ИНТЕРФЕЙС / УТИЛИТЫ ---
        function rollDice() { if (isHost) processRoll(myId); else if (hostConn) hostConn.send({ type: 'ROLL' }); }
        function buyCurrentCell() { if (isHost) processBuy(myId); else if (hostConn) hostConn.send({ type: 'BUY' }); }
        function buildHouse() { if (isHost) processBuild(myId, selectedCellId); else if (hostConn) hostConn.send({ type: 'BUILD', cellId: selectedCellId }); }
        function endTurn() { if (isHost) processEndTurn(myId); else if (hostConn) hostConn.send({ type: 'END_TURN' }); }

        function broadcastState() { syncUI(); clientConns.forEach(c => c.send({ type: 'STATE', players, ownedCells, currentTurnIndex, turnPhase })); }
        function broadcastLog(name, text) { appendLog(name, text); clientConns.forEach(c => c.send({ type: 'LOG', name, text })); }
        function appendLog(n, t) { const b = document.getElementById('chat-messages'); b.innerHTML += `<div><b>${n}:</b> ${t}</div>`; b.scrollTop = b.scrollHeight; }
        function sendChat() {
            const i = document.getElementById('chat-input'), txt = i.value.trim(); if(!txt) return;
            const name = document.getElementById('username').value || 'Игрок';
            if (isHost) broadcastLog(name, txt); else hostConn.send({ type: 'CHAT', name, text: txt }); i.value = '';
        }

        // Вспомогательная функция для отрисовки точек на кубике
        function renderDieFace(element, faceValue) {
            element.className = `die face-${faceValue}`;
            element.innerHTML = '';
            for (let i = 0; i < faceValue; i++) {
                const pip = document.createElement('div');
                pip.className = 'pip';
                element.appendChild(pip);
            }
        }

        // Новая красивая анимация броска
        function playDiceAnim(d1, d2, cb) {
            const rollBtn = document.getElementById('roll-btn');
            const die1 = document.getElementById('die-1');
            const die2 = document.getElementById('die-2');
            const wrap1 = document.getElementById('die-wrap-1');
            const wrap2 = document.getElementById('die-wrap-2');

            rollBtn.disabled = true;
            
            // Включаем 3D анимацию
            die1.classList.add('rolling');
            die2.classList.add('rolling');
            wrap1.classList.add('rolling');
            wrap2.classList.add('rolling');

            // Быстрая смена лиц во время кувыркания для эффекта случайности
            let rollInterval = setInterval(() => {
                renderDieFace(die1, Math.floor(Math.random() * 6) + 1);
                renderDieFace(die2, Math.floor(Math.random() * 6) + 1);
            }, 60);

            // Останавливаем через 800мс (длительность CSS-анимации)
            setTimeout(() => {
                clearInterval(rollInterval);
                
                // Убираем класс анимации
                die1.classList.remove('rolling');
                die2.classList.remove('rolling');
                wrap1.classList.remove('rolling');
                wrap2.classList.remove('rolling');

                // Устанавливаем финальные значения
                renderDieFace(die1, d1);
                renderDieFace(die2, d2);
                
                rollBtn.disabled = false; 
                if(cb) cb();
            }, 800); 
        }

        function syncUI() {
            renderBoard();
            const activePlayer = players[currentTurnIndex];
            document.getElementById('turn-banner').innerText = activePlayer ? `Ход: ${activePlayer.name}` : '';

            ['left', 'right'].forEach(side => document.getElementById(`${side}-players`).innerHTML = '');
            players.forEach((p, i) => {
                const propsHTML = Object.keys(ownedCells).filter(id => ownedCells[id].ownerId === p.id)
                    .map(id => `<div class="prop-pip" style="background:${BOARD_CELLS[id].color}"></div>`).join('');
                const html = `
                    <div class="player-card ${i === currentTurnIndex ? 'active' : ''}">
                        <div class="player-identity"><span class="player-token-dot" style="background:${p.color}"></span>${p.name}</div>
                        <div class="player-money">$${p.money}</div>
                        <div>${propsHTML}</div>
                    </div>`;
                document.getElementById(i < 3 ? 'left-players' : 'right-players').innerHTML += html;
                document.getElementById(`tokens-cell-${p.pos}`).innerHTML += `<div class="board-token" style="background:${p.color}"></div>`;
            });

            const inspCell = BOARD_CELLS[selectedCellId || 0];
            const inspOwner = ownedCells[inspCell.id];
            document.getElementById('insp-color').style.background = inspCell.color || '#cbd5e1';
            document.getElementById('insp-title').innerText = inspCell.name;
            document.getElementById('insp-meta').innerText = inspCell.price ? `Цена: $${inspCell.price} | Рента: $${calculateRent(inspCell.id)}` : (inspCell.sub || '');

            const isMyTurn = activePlayer && activePlayer.id === myId;
            document.getElementById('roll-btn').style.display = (isMyTurn && turnPhase === 'ROLL') ? 'inline-block' : 'none';
            document.getElementById('end-turn-btn').style.display = (isMyTurn && turnPhase === 'ACTION') ? 'inline-block' : 'none';
            document.getElementById('trade-btn').style.display = (isMyTurn && turnPhase === 'ACTION' && players.length > 1) ? 'inline-block' : 'none';
            
            const myPosCell = BOARD_CELLS[activePlayer ? activePlayer.pos : 0];
            const canBuy = isMyTurn && turnPhase === 'ACTION' && myPosCell.price && !ownedCells[myPosCell.id] && activePlayer.money >= myPosCell.price;
            document.getElementById('buy-btn').style.display = canBuy ? 'inline-block' : 'none';

            let canBuild = false;
            if (isMyTurn && inspCell.type === 'street' && inspOwner && inspOwner.ownerId === myId && inspOwner.houses < 5) {
                const sameColor = BOARD_CELLS.filter(c => c.color === inspCell.color);
                const hasMonopoly = sameColor.every(c => ownedCells[c.id] && ownedCells[c.id].ownerId === myId);
                if (hasMonopoly && activePlayer.money >= inspCell.housePrice) canBuild = true;
            }
            document.getElementById('build-btn').style.display = canBuild ? 'inline-block' : 'none';
            if (canBuild) document.getElementById('build-btn').innerText = `Построить ($${inspCell.housePrice})`;
        }

        function copyInviteLink() { navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?room=${activeRoomId}`); alert('Ссылка скопирована!'); }
    </script>
