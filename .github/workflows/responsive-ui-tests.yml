name: Responsive UI browser tests
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/ui-layout-check.cjs'
      - '.github/workflows/responsive-ui-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/ui-layout-check.cjs'
      - '.github/workflows/responsive-ui-tests.yml'
  workflow_dispatch:

jobs:
  responsive-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive layout checks
        run: node .github/ui-layout-check.cjs
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-screenshots
          path: screenshots/
          if-no-files-found: ignore

